name: price-watch

services:
  db:
    image: postgres:18.4-alpine3.24
    container_name: price-watch-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - "postgres_data:/var/lib/postgresql/18/docker"

    ports:
      - "5432:5432"

volumes:
    postgres_data: